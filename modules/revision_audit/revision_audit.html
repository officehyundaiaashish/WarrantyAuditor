<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revision Audit Module</title>
</head>
<body>

<script>
(function () {
    // Helper to reference top/parent window and document (supports iframe or standalone)
    function getTargetWindow() {
        try {
            return (window.parent && window.parent.document) ? window.parent : window;
        } catch (e) {
            return window;
        }
    }

    function getTargetDocument() {
        try {
            return (window.parent && window.parent.document) ? window.parent.document : document;
        } catch (e) {
            return document;
        }
    }

    // ── 1. INJECT MODULE STYLES INTO TARGET DOCUMENT ──
    const styles = `
    /* Revision Audit Container */
    #revision-audit-container {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    /* Revision Audit Trigger Button */
    .btn-revision-audit {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
        color: #6366f1;
        border: 1px solid rgba(99, 102, 241, 0.35);
        font-weight: 600;
        font-size: 0.78rem;
        padding: 6px 11px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .btn-revision-audit:hover {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25));
        border-color: rgba(99, 102, 241, 0.6);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }

    .btn-revision-audit:active {
        transform: translateY(0);
    }

    /* Version Navigation Switcher Bar */
    .revision-version-bar {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(0, 0, 0, 0.04);
        padding: 3px;
        border-radius: 8px;
        border: 1px solid var(--border, rgba(229, 231, 235, 0.8));
        flex-wrap: wrap;
    }

    .revision-version-pill {
        padding: 4px 10px;
        font-size: 0.73rem;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-muted, #6b7280);
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.15;
    }

    .revision-version-pill .rev-pill-title {
        font-weight: 700;
    }

    .revision-version-pill .rev-pill-time {
        font-size: 0.62rem;
        opacity: 0.8;
        font-weight: 400;
        margin-top: 1px;
    }

    .revision-version-pill:hover {
        color: var(--text-main, #1f2937);
        background: rgba(255, 255, 255, 0.6);
    }

    .revision-version-pill.active {
        background: var(--bg-card, #ffffff);
        color: var(--primary, #2ab5a5);
        border-color: rgba(42, 181, 165, 0.3);
        font-weight: 700;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* Modal Backdrop & Sheet */
    .rev-modal-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        padding: 16px;
    }

    .rev-modal-backdrop.active {
        opacity: 1;
        pointer-events: auto;
    }

    .rev-modal-sheet {
        background: var(--bg-card, #ffffff);
        color: var(--text-main, #1e293b);
        width: 100%;
        max-width: 520px;
        border-radius: 16px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border, #e2e8f0);
        overflow: hidden;
        transform: scale(0.95) translateY(10px);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rev-modal-backdrop.active .rev-modal-sheet {
        transform: scale(1) translateY(0);
    }

    .rev-modal-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border, #f1f5f9);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .rev-modal-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--text-main, #0f172a);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .rev-modal-close {
        background: transparent;
        border: none;
        font-size: 1.25rem;
        color: var(--text-muted, #94a3b8);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: 0.15s;
    }

    .rev-modal-close:hover {
        background: rgba(0, 0, 0, 0.05);
        color: var(--text-main, #0f172a);
    }

    .rev-modal-body {
        padding: 20px 24px;
    }

    .rev-modal-subtitle {
        font-size: 0.85rem;
        color: var(--text-muted, #64748b);
        margin-top: 0;
        margin-bottom: 18px;
        line-height: 1.45;
    }

    .rev-options-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
    }

    .rev-option-card {
        border: 2px solid var(--border, #e2e8f0);
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        background: var(--bg-base, #fafafa);
        position: relative;
    }

    .rev-option-card:hover {
        border-color: rgba(99, 102, 241, 0.5);
        background: rgba(99, 102, 241, 0.02);
    }

    .rev-option-card.selected {
        border-color: #6366f1;
        background: rgba(99, 102, 241, 0.05);
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.12);
    }

    .rev-option-radio {
        margin-top: 3px;
        accent-color: #6366f1;
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .rev-option-content {
        flex: 1;
    }

    .rev-option-title {
        font-weight: 700;
        font-size: 0.92rem;
        color: var(--text-main, #1e293b);
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .rev-option-desc {
        font-size: 0.78rem;
        color: var(--text-muted, #64748b);
        line-height: 1.35;
    }

    .rev-upload-box {
        margin-top: 12px;
        border: 2px dashed rgba(99, 102, 241, 0.4);
        border-radius: 8px;
        padding: 14px;
        text-align: center;
        background: rgba(255, 255, 255, 0.7);
        transition: 0.2s;
    }

    .rev-upload-box:hover {
        border-color: #6366f1;
        background: #ffffff;
    }

    .rev-file-input {
        display: none;
    }

    .rev-file-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        background: #6366f1;
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.15s;
    }

    .rev-file-label:hover {
        background: #4f46e5;
    }

    .rev-file-name {
        margin-top: 8px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #4338ca;
        word-break: break-all;
    }

    .rev-info-banner {
        background: rgba(16, 185, 129, 0.08);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.76rem;
        color: var(--success, #059669);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .rev-modal-footer {
        padding: 16px 24px 20px;
        border-top: 1px solid var(--border, #f1f5f9);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        background: var(--bg-base, #fafafa);
    }

    .rev-btn-cancel {
        padding: 8px 16px;
        font-size: 0.82rem;
        font-weight: 600;
        border: 1px solid var(--border, #cbd5e1);
        background: transparent;
        color: var(--text-main, #475569);
        border-radius: 8px;
        cursor: pointer;
        transition: 0.15s;
    }

    .rev-btn-cancel:hover {
        background: rgba(0, 0, 0, 0.04);
    }

    .rev-btn-confirm {
        padding: 8px 20px;
        font-size: 0.82rem;
        font-weight: 700;
        border: none;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #ffffff;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        transition: all 0.2s ease;
    }

    .rev-btn-confirm:hover {
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        transform: translateY(-1px);
    }

    .rev-btn-confirm:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }
    `;

    function injectStyles() {
        const doc = getTargetDocument();
        if (!doc.getElementById('rev-audit-style')) {
            const styleTag = doc.createElement('style');
            styleTag.id = 'rev-audit-style';
            styleTag.textContent = styles;
            doc.head.appendChild(styleTag);
        }
    }

    // ── 2. INJECT MODAL HTML INTO TARGET DOCUMENT BODY ──
    const modalHtml = `
    <div id="rev-sheet-backdrop" class="rev-modal-backdrop">
        <div class="rev-modal-sheet" onclick="event.stopPropagation()">
            <div class="rev-modal-header">
                <h4 class="rev-modal-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6"></path>
                        <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                    </svg>
                    Create Revision Audit
                </h4>
                <button class="rev-modal-close" onclick="RevisionAuditModule.closeRevisionSheet()">&times;</button>
            </div>

            <div class="rev-modal-body">
                <p class="rev-modal-subtitle">
                    Create a new revision of this audit. The current audit (<strong id="rev-parent-name">Audit 1</strong>) will be 
                    <strong>100% preserved and unchanged</strong>. All markings for the new revision will start fresh.
                </p>

                <div class="rev-options-grid">
                    <!-- Option 1: New Upload -->
                    <div class="rev-option-card" id="rev-card-new" onclick="RevisionAuditModule.selectOption('new')">
                        <input type="radio" name="rev-option" id="rev-opt-new" class="rev-option-radio" value="new" checked>
                        <div class="rev-option-content">
                            <div class="rev-option-title">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                Upload a new warranty claim list
                            </div>
                            <div class="rev-option-desc">Upload an updated Excel or CSV claim list file for the same audit period.</div>

                            <div id="rev-upload-panel" class="rev-upload-box" style="display: block;">
                                <label for="rev-file-input" class="rev-file-label">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                                    Choose File (.xlsx, .csv)
                                </label>
                                <input type="file" id="rev-file-input" class="rev-file-input" accept=".xlsx, .xls, .csv" onchange="RevisionAuditModule.handleFileSelect(event)">
                                <div id="rev-file-name" class="rev-file-name">No file selected</div>
                            </div>
                        </div>
                    </div>

                    <!-- Option 2: Reuse Existing -->
                    <div class="rev-option-card" id="rev-card-existing" onclick="RevisionAuditModule.selectOption('existing')">
                        <input type="radio" name="rev-option" id="rev-opt-existing" class="rev-option-radio" value="existing">
                        <div class="rev-option-content">
                            <div class="rev-option-title">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Use existing warranty claim list
                            </div>
                            <div class="rev-option-desc">Re-use the exact same list of claims from Audit 1, but clear all audit markings to start over.</div>
                        </div>
                    </div>
                </div>

                <div class="rev-info-banner">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span>New revision will be created as <strong id="rev-next-name">Audit 2</strong>.</span>
                </div>
            </div>

            <div class="rev-modal-footer">
                <button class="rev-btn-cancel" onclick="RevisionAuditModule.closeRevisionSheet()">Cancel</button>
                <button class="rev-btn-confirm" id="rev-btn-submit" onclick="RevisionAuditModule.confirmCreateRevision()">Create Revision</button>
            </div>
        </div>
    </div>`;

    function injectModal() {
        const doc = getTargetDocument();
        if (!doc.getElementById('rev-sheet-backdrop')) {
            const wrapper = doc.createElement('div');
            wrapper.innerHTML = modalHtml;
            doc.body.appendChild(wrapper.firstElementChild);
        }
    }

    // ── 3. MODULE CONTROLLER ──
    let _activeSessionKey = null;
    let _selectedOption = 'new';
    let _uploadedFile = null;

    function formatCreationTime(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            const dayMonth = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
            const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            return `${dayMonth}, ${timeStr}`;
        } catch (e) {
            return '';
        }
    }

    function getRevisionFamily(sessionKey) {
        const win = getTargetWindow();
        if (!sessionKey || !win.dbIndex) return [];
        const currentMeta = win.dbIndex[sessionKey];
        const rootKey = (currentMeta && currentMeta.root_key) ? currentMeta.root_key : sessionKey;

        const family = [];
        for (const [key, meta] of Object.entries(win.dbIndex)) {
            const metaRoot = meta.root_key || key;
            if (metaRoot === rootKey) {
                family.push({
                    key: key,
                    meta: meta,
                    revNum: meta.revision_number || 1,
                    createdAt: meta.created_at || meta.last_saved || ''
                });
            }
        }
        family.sort((a, b) => a.revNum - b.revNum);
        return family;
    }

    function initWorkspace(sessionKey) {
        injectStyles();
        injectModal();

        const win = getTargetWindow();
        const doc = getTargetDocument();

        sessionKey = sessionKey || win.currentSessionKey;
        _activeSessionKey = sessionKey;

        const container = doc.getElementById('revision-audit-container');
        if (!container) return;

        container.innerHTML = '';

        if (sessionKey && win.dbIndex && !win.dbIndex[sessionKey]) {
            const titleEl = doc.getElementById('workspace-title');
            win.dbIndex[sessionKey] = {
                month: titleEl ? titleEl.innerText : 'Current Audit',
                last_saved: new Date().toLocaleString(),
                finalized: false,
                revision_number: 1,
                created_at: new Date().toISOString()
            };
        }

        const family = sessionKey ? getRevisionFamily(sessionKey) : [];

        // Render "Revision Audit" button
        const revBtn = doc.createElement('button');
        revBtn.className = 'btn-revision-audit';
        revBtn.title = 'Create a new version/revision of this audit';
        revBtn.onclick = openRevisionSheet;
        revBtn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6"></path>
                <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
            <span>Revision Audit</span>
        `;
        container.appendChild(revBtn);

        // Render Version Navigation Switcher Bar
        if (family.length > 0) {
            const versionBar = doc.createElement('div');
            versionBar.className = 'revision-version-bar';

            family.forEach(item => {
                const pill = doc.createElement('button');
                pill.className = `revision-version-pill ${item.key === sessionKey ? 'active' : ''}`;
                const timeLabel = formatCreationTime(item.createdAt);

                pill.innerHTML = `
                    <span class="rev-pill-title">Audit ${item.revNum}</span>
                    ${timeLabel ? `<span class="rev-pill-time">${timeLabel}</span>` : ''}
                `;
                pill.title = `Audit ${item.revNum} — Created: ${item.createdAt || 'N/A'}`;
                pill.onclick = () => switchVersion(item.key);
                versionBar.appendChild(pill);
            });

            container.appendChild(versionBar);
        }
    }

    function openRevisionSheet() {
        const win = getTargetWindow();
        const doc = getTargetDocument();

        if (!_activeSessionKey || !win.dbIndex || !win.dbIndex[_activeSessionKey]) {
            if (typeof win.showAppAlert === 'function') {
                win.showAppAlert("Please open an audit first before creating a revision.");
            } else {
                alert("Please open an audit first before creating a revision.");
            }
            return;
        }

        const family = getRevisionFamily(_activeSessionKey);
        const currentMeta = win.dbIndex[_activeSessionKey];
        const nextRevNum = family.length > 0 ? (family[family.length - 1].revNum + 1) : 2;

        const parentNameEl = doc.getElementById('rev-parent-name');
        const nextNameEl = doc.getElementById('rev-next-name');
        if (parentNameEl) parentNameEl.innerText = `Audit ${currentMeta.revision_number || 1}`;
        if (nextNameEl) nextNameEl.innerText = `Audit ${nextRevNum}`;

        _selectedOption = 'new';
        _uploadedFile = null;
        const fileInput = doc.getElementById('rev-file-input');
        const fileNameEl = doc.getElementById('rev-file-name');
        if (fileInput) fileInput.value = '';
        if (fileNameEl) fileNameEl.innerText = 'No file selected';

        selectOption('new');

        const sheet = doc.getElementById('rev-sheet-backdrop');
        if (sheet) sheet.classList.add('active');
    }

    function closeRevisionSheet() {
        const doc = getTargetDocument();
        const sheet = doc.getElementById('rev-sheet-backdrop');
        if (sheet) sheet.classList.remove('active');
    }

    function selectOption(option) {
        const doc = getTargetDocument();
        _selectedOption = option;
        const cardNew = doc.getElementById('rev-card-new');
        const cardExisting = doc.getElementById('rev-card-existing');
        const optNew = doc.getElementById('rev-opt-new');
        const optExisting = doc.getElementById('rev-opt-existing');
        const uploadPanel = doc.getElementById('rev-upload-panel');

        if (cardNew) cardNew.classList.toggle('selected', option === 'new');
        if (cardExisting) cardExisting.classList.toggle('selected', option === 'existing');

        if (optNew) optNew.checked = (option === 'new');
        if (optExisting) optExisting.checked = (option === 'existing');

        if (uploadPanel) uploadPanel.style.display = (option === 'new') ? 'block' : 'none';
    }

    function handleFileSelect(evt) {
        const doc = getTargetDocument();
        const files = evt.target.files;
        if (files && files.length > 0) {
            _uploadedFile = files[0];
            const fileNameEl = doc.getElementById('rev-file-name');
            if (fileNameEl) fileNameEl.innerText = _uploadedFile.name;
        }
    }

    async function confirmCreateRevision() {
        const win = getTargetWindow();
        if (!_activeSessionKey) return;
        if (typeof win.showLoader === 'function') win.showLoader(true);

        try {
            const family = getRevisionFamily(_activeSessionKey);
            const currentMeta = win.dbIndex[_activeSessionKey];
            const rootKey = currentMeta.root_key || _activeSessionKey;
            const nextRevNum = family.length > 0 ? (family[family.length - 1].revNum + 1) : 2;

            const parentSession = await win.localforage.getItem(_activeSessionKey);
            if (!parentSession) throw new Error("Original audit session data not found.");

            let filteredData = [];
            let colMapToUse = parentSession.col_map || {};

            if (_selectedOption === 'new') {
                if (!_uploadedFile) {
                    if (typeof win.showLoader === 'function') win.showLoader(false);
                    return win.showAppAlert ? win.showAppAlert("Please select an Excel or CSV file to upload.") : alert("Please select a file.");
                }

                const parsed = await parseUploadedFile(_uploadedFile, colMapToUse);
                filteredData = parsed.filteredData;
                colMapToUse = parsed.colMap;
            } else {
                filteredData = JSON.parse(JSON.stringify(parentSession.filtered_data || []));
            }

            const nowIso = new Date().toISOString();
            const nowDisplay = new Date().toLocaleString();
            const newKey = `${rootKey}_rev_${nextRevNum}_${Date.now()}`;

            const newSession = {
                month: parentSession.month,
                year: parentSession.year || '',
                last_saved: nowDisplay,
                finalized: false,
                col_map: colMapToUse,
                audit_data: {}, // Markings CLEARED!
                filtered_data: filteredData,
                root_key: rootKey,
                revision_number: nextRevNum,
                created_at: nowIso
            };

            await win.localforage.setItem(newKey, newSession);

            win.dbIndex[newKey] = {
                month: parentSession.month,
                last_saved: nowDisplay,
                finalized: false,
                root_key: rootKey,
                revision_number: nextRevNum,
                created_at: nowIso
            };

            family.forEach(item => {
                if (!win.dbIndex[item.key].revision_number) {
                    win.dbIndex[item.key].revision_number = item.revNum;
                }
                if (!win.dbIndex[item.key].root_key) {
                    win.dbIndex[item.key].root_key = rootKey;
                }
            });

            await win.localforage.setItem('db_index', win.dbIndex);
            if (typeof win.saveSessionToDB === 'function') {
                await win.saveSessionToDB(newSession, newKey);
            }

            closeRevisionSheet();
            if (typeof win.showLoader === 'function') win.showLoader(false);
            if (typeof win.showToast === 'function') win.showToast(`Audit ${nextRevNum} created successfully! Markings cleared.`, 'success', 4000);

            await win.loadSession(newKey);
            initWorkspace(newKey);

        } catch (e) {
            if (typeof win.showLoader === 'function') win.showLoader(false);
            console.error(e);
            if (typeof win.showAppAlert === 'function') win.showAppAlert("Failed to create revision: " + e.message);
        }
    }

    function parseUploadedFile(file, existingColMap) {
        const win = getTargetWindow();
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = win.XLSX.read(data, { type: 'array' });
                    const jsonData = win.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                    if (jsonData.length === 0) return reject(new Error("Uploaded file is empty."));

                    let colMap = win.detectColumns ? win.detectColumns(Object.keys(jsonData[0])) : existingColMap;
                    if (!colMap.claim_no) colMap = existingColMap;

                    const filteredData = jsonData.filter(row => {
                        const type = String(row[colMap.claim_type] || "").toUpperCase();
                        const amt = parseFloat(row[colMap.amount]) || 0;
                        const desc = String(row[colMap.part_desc] || "").toUpperCase();
                        if (type.includes("FREE SERVICE") || type.includes("FSC")) return false;
                        if (type.includes("CAMPAIGN") && amt < 300 && !desc.includes("POWER WINDOW") && !desc.includes("FUEL PUMP")) return false;
                        return true;
                    });

                    resolve({ filteredData, colMap });
                } catch (err) {
                    reject(err);
                }
            };
            reader.onerror = () => reject(new Error("Error reading uploaded file."));
            reader.readAsArrayBuffer(file);
        });
    }

    async function switchVersion(targetKey) {
        const win = getTargetWindow();
        if (!targetKey || targetKey === _activeSessionKey) return;
        if (typeof win.loadSession === 'function') {
            await win.loadSession(targetKey);
            initWorkspace(targetKey);
        }
    }

    // Export module globally on window AND target parent window
    const moduleExport = {
        initWorkspace: initWorkspace,
        openRevisionSheet: openRevisionSheet,
        closeRevisionSheet: closeRevisionSheet,
        selectOption: selectOption,
        handleFileSelect: handleFileSelect,
        confirmCreateRevision: confirmCreateRevision,
        switchVersion: switchVersion
    };

    window.RevisionAuditModule = moduleExport;
    const targetWin = getTargetWindow();
    if (targetWin !== window) {
        targetWin.RevisionAuditModule = moduleExport;
    }

    // Auto-init on load if workspace is active
    setTimeout(() => {
        const win = getTargetWindow();
        const doc = getTargetDocument();
        const workspaceScreen = doc.getElementById('screen-workspace');
        if (win.currentSessionKey || (workspaceScreen && workspaceScreen.classList.contains('active'))) {
            initWorkspace(win.currentSessionKey);
        }
    }, 200);

})();
</script>
